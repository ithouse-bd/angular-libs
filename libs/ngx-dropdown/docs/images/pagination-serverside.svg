<svg width="600" height="280" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="280" fill="#f8f9fa"/>
  <text x="30" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#212529">Server-Side Pagination with API</text>
  
  <g transform="translate(30, 60)">
    <!-- Trigger -->
    <rect x="0" y="0" width="350" height="38" rx="4" fill="white" stroke="#ced4da" stroke-width="1"/>
    <text x="12" y="24" font-family="Arial, sans-serif" font-size="14" fill="#212529">Customer Name</text>
    <text x="330" y="24" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">▼</text>
    
    <!-- Panel -->
    <rect x="0" y="42" width="350" height="185" rx="4" fill="white" stroke="#ced4da" stroke-width="1" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
    
    <!-- Search -->
    <rect x="8" y="50" width="334" height="30" rx="4" fill="white" stroke="#ced4da" stroke-width="1"/>
    <text x="18" y="69" font-family="Arial, sans-serif" font-size="13" fill="#6c757d">Search customers...</text>
    <line x1="0" y1="88" x2="350" y2="88" stroke="#dee2e6" stroke-width="1"/>
    
    <!-- Options (selected one visible) -->
    <rect x="12" y="100" width="20" height="20" rx="4" fill="white" stroke="#ced4da"/>
    <text x="38" y="115" font-family="Arial, sans-serif" font-size="14" fill="#212529">John Doe (ID: 101)</text>
    
    <rect x="12" y="130" width="20" height="20" rx="4" fill="white" stroke="#ced4da"/>
    <text x="38" y="145" font-family="Arial, sans-serif" font-size="14" fill="#212529">Jane Smith (ID: 102)</text>
    
    <rect x="12" y="160" width="20" height="20" rx="4" fill="#e7f1ff" stroke="#0d6efd" stroke-width="2"/>
    <text x="15" y="171" font-family="Arial, sans-serif" font-size="12" fill="white">✓</text>
    <text x="38" y="175" font-family="Arial, sans-serif" font-size="14" fill="#0d6efd">Bob Johnson (ID: 103)</text>
    
    <rect x="12" y="190" width="20" height="20" rx="4" fill="white" stroke="#ced4da"/>
    <text x="38" y="205" font-family="Arial, sans-serif" font-size="14" fill="#212529">Alice Brown (ID: 104)</text>
    
    <line x1="0" y1="120" x2="350" y2="120" stroke="#f1f1f1"/>
    <line x1="0" y1="150" x2="350" y2="150" stroke="#f1f1f1"/>
    <line x1="0" y1="180" x2="350" y2="180" stroke="#f1f1f1"/>
    <line x1="0" y1="210" x2="350" y2="210" stroke="#f1f1f1"/>
    
    <!-- Pagination -->
    <rect x="0" y="150" width="350" height="30" fill="#f8f9fa"/>
    <text x="12" y="170" font-family="Arial, sans-serif" font-size="12" fill="#495057">Page 1 / 5</text>
    <rect x="270" y="156" width="30" height="20" rx="4" fill="white" stroke="#ced4da"/>
    <text x="285" y="169" font-family="Arial, sans-serif" font-size="14" fill="#212529">›</text>
    <rect x="310" y="156" width="30" height="20" rx="4" fill="white" stroke="#ced4da"/>
    <text x="325" y="169" font-family="Arial, sans-serif" font-size="14" fill="#212529">...</text>
    <rect x="350" y="156" width="30" height="20" rx="4" fill="white" stroke="#ced4da"/>
    <text x="365" y="169" font-family="Arial, sans-serif" font-size="14" fill="#212529">→</text>
  </g>
</svg>
