<svg width="600" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="200" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="30" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#212529">Basic Single Select Dropdown</text>
  
  <!-- Dropdown container -->
  <g transform="translate(30, 60)">
    <!-- Trigger -->
    <rect x="0" y="0" width="350" height="38" rx="4" fill="white" stroke="#ced4da" stroke-width="1"/>
    <text x="12" y="24" font-family="Arial, sans-serif" font-size="14" fill="#6c757d">Select a fruit</text>
    <text x="330" y="24" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">▼</text>
    
    <!-- Dropdown panel (open) -->
    <rect x="0" y="42" width="350" height="120" rx="4" fill="white" stroke="#ced4da" stroke-width="1" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
    
    <!-- Options -->
    <rect x="0" y="42" width="350" height="30" fill="#e7f1ff"/>
    <text x="12" y="61" font-family="Arial, sans-serif" font-size="14" fill="#0d6efd">Apple</text>
    
    <text x="12" y="91" font-family="Arial, sans-serif" font-size="14" fill="#212529">Banana</text>
    <line x1="0" y1="72" x2="350" y2="72" stroke="#dee2e6" stroke-width="1"/>
    
    <text x="12" y="121" font-family="Arial, sans-serif" font-size="14" fill="#212529">Orange</text>
    <line x1="0" y1="102" x2="350" y2="102" stroke="#dee2e6" stroke-width="1"/>
    
    <text x="12" y="151" font-family="Arial, sans-serif" font-size="14" fill="#212529">Grape</text>
    <line x1="0" y1="132" x2="350" y2="132" stroke="#dee2e6" stroke-width="1"/>
  </g>
</svg>
