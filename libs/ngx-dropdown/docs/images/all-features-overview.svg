<svg width="640" height="400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Overview of the ith-dropdown features">
  <rect width="640" height="400" fill="#f8f9fa"/>
  <text x="320" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#212529">@ithouse/ngx-dropdown — Feature Overview</text>

  <!-- Column 1: single / multi select -->
  <rect x="30" y="55" width="280" height="36" rx="4" fill="#ffffff" stroke="#86b7fe" stroke-width="2"/>
  <text x="45" y="78" font-family="Arial, sans-serif" font-size="13" fill="#212529">Apple</text>
  <rect x="262" y="65" width="36" height="16" rx="8" fill="#e7f1ff" stroke="#0d6efd"/>
  <text x="271" y="77" font-family="Arial, sans-serif" font-size="10" fill="#0d6efd">Apple</text>

  <rect x="30" y="110" width="280" height="36" rx="4" fill="#ffffff" stroke="#ced4da"/>
  <text x="45" y="133" font-family="Arial, sans-serif" font-size="13" fill="#212529">United States, United Kingdom</text>

  <!-- Column 1: open panel -->
  <rect x="30" y="160" width="280" height="130" rx="4" fill="#ffffff" stroke="#ced4da"/>
  <rect x="38" y="168" width="264" height="26" rx="3" fill="#ffffff" stroke="#ced4da"/>
  <text x="48" y="186" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">Search...</text>
  <rect x="30" y="202" width="280" height="22" fill="#f8f9fa"/>
  <text x="44" y="217" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#495057">FRUITS</text>
  <text x="44" y="239" font-family="Arial, sans-serif" font-size="12" fill="#0d6efd">✓ Apple</text>
  <text x="44" y="258" font-family="Arial, sans-serif" font-size="12" fill="#212529">Banana</text>
  <text x="44" y="277" font-family="Arial, sans-serif" font-size="12" fill="#adb5bd">Orange (disabled)</text>

  <!-- Column 2: pagination -->
  <rect x="340" y="55" width="270" height="36" rx="4" fill="#ffffff" stroke="#ced4da"/>
  <text x="355" y="78" font-family="Arial, sans-serif" font-size="13" fill="#6c757d">Search from large list</text>
  <text x="592" y="78" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">▼</text>

  <rect x="340" y="105" width="270" height="120" rx="4" fill="#ffffff" stroke="#ced4da"/>
  <text x="356" y="128" font-family="Arial, sans-serif" font-size="12" fill="#212529">Item 1</text>
  <text x="356" y="150" font-family="Arial, sans-serif" font-size="12" fill="#212529">Item 2</text>
  <text x="356" y="172" font-family="Arial, sans-serif" font-size="12" fill="#212529">Item 3</text>
  <text x="356" y="194" font-family="Arial, sans-serif" font-size="12" fill="#212529">Item 4 …</text>
  <rect x="340" y="225" width="270" height="30" rx="3" fill="#f8f9fa" stroke="#ced4da"/>
  <text x="352" y="245" font-family="Arial, sans-serif" font-size="12" fill="#0d6efd">‹</text>
  <text x="455" y="245" font-family="Arial, sans-serif" font-size="12" fill="#495057">Page 1 / 10</text>
  <text x="588" y="245" font-family="Arial, sans-serif" font-size="12" fill="#0d6efd">›</text>

  <!-- Column 2: infinite scroll -->
  <rect x="340" y="275" width="270" height="90" rx="4" fill="#ffffff" stroke="#ced4da"/>
  <text x="356" y="298" font-family="Arial, sans-serif" font-size="12" fill="#212529">Item 15</text>
  <text x="356" y="318" font-family="Arial, sans-serif" font-size="12" fill="#212529">Item 16</text>
  <text x="356" y="340" font-family="Arial, sans-serif" font-size="12" fill="#0d6efd" text-anchor="middle">Load more…</text>

  <text x="320" y="388" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6c757d">Single &amp; multi select · search · grouping · pagination · infinite scroll · keyboard navigation · theming</text>
</svg>
