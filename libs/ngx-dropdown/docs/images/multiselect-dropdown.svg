<svg width="600" height="250" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="250" fill="#f8f9fa"/>
  <text x="30" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#212529">Multi-Select with Search</text>
  
  <g transform="translate(30, 60)">
    <!-- Trigger -->
    <rect x="0" y="0" width="350" height="38" rx="4" fill="white" stroke="#ced4da" stroke-width="1"/>
    <text x="12" y="24" font-family="Arial, sans-serif" font-size="14" fill="#212529">2 items selected</text>
    <text x="320" y="24" font-family="Arial, sans-serif" font-size="16" fill="#6c757d">×</text>
    <text x="330" y="24" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">▼</text>
    
    <!-- Panel -->
    <rect x="0" y="42" width="350" height="170" rx="4" fill="white" stroke="#ced4da" stroke-width="1" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
    
    <!-- Search -->
    <rect x="8" y="50" width="334" height="30" rx="4" fill="white" stroke="#ced4da" stroke-width="1"/>
    <text x="18" y="69" font-family="Arial, sans-serif" font-size="13" fill="#6c757d">Search...</text>
    <line x1="0" y1="88" x2="350" y2="88" stroke="#dee2e6" stroke-width="1"/>
    
    <!-- Actions -->
    <rect x="0" y="88" width="350" height="28" fill="#f8f9fa"/>
    <text x="12" y="106" font-family="Arial, sans-serif" font-size="13" fill="#0d6efd">Select All</text>
    <text x="90" y="106" font-family="Arial, sans-serif" font-size="13" fill="#0d6efd">Clear All</text>
    <line x1="0" y1="116" x2="350" y2="116" stroke="#dee2e6" stroke-width="1"/>
    
    <!-- Options -->
    <rect x="12" y="125" width="14" height="14" rx="2" fill="#0d6efd" stroke="#0d6efd"/>
    <text x="15" y="136" font-family="Arial, sans-serif" font-size="12" fill="white">✓</text>
    <text x="35" y="136" font-family="Arial, sans-serif" font-size="14" fill="#0d6efd">United States</text>
    
    <rect x="12" y="150" width="14" height="14" rx="2" fill="#0d6efd" stroke="#0d6efd"/>
    <text x="15" y="161" font-family="Arial, sans-serif" font-size="12" fill="white">✓</text>
    <text x="35" y="161" font-family="Arial, sans-serif" font-size="14" fill="#0d6efd">United Kingdom</text>
    
    <rect x="12" y="175" width="14" height="14" rx="2" fill="white" stroke="#ced4da"/>
    <text x="35" y="186" font-family="Arial, sans-serif" font-size="14" fill="#212529">Canada</text>
    
    <rect x="12" y="200" width="14" height="14" rx="2" fill="white" stroke="#ced4da"/>
    <text x="35" y="211" font-family="Arial, sans-serif" font-size="14" fill="#212529">Australia</text>
  </g>
</svg>
