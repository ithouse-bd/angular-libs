    </filter>
  </defs>

  <rect width="960" height="460" fill="#f6f5fb" />
  <g filter="url(#card-shadow)">
    <rect x="24" y="24" width="912" height="412" rx="14" fill="#ffffff" stroke="#e8eaf0" />
  </g>

  <!-- toolbar -->
  <text x="48" y="63" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Student List</text>
