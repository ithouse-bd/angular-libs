  <line x1="764.5" y1="63.5" x2="769" y2="68" stroke="#9ca3af" stroke-width="1.8" stroke-linecap="round" />
  <text x="780" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9ca3af">Search…</text>

  <!-- header -->
