    <rect x="684" y="346" width="30" height="28" rx="7" fill="#ffffff" stroke="#e8eaf0" />
    <path d="M701 354l-5 6 5 6" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="718" y="346" width="30" height="28" rx="7" fill="#6d28d9" />
    <text x="733" y="365" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff">1</text>
    <rect x="752" y="346" width="30" height="28" rx="7" fill="#ffffff" stroke="#e8eaf0" />
    <text x="767" y="365" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#374151">2</text>
