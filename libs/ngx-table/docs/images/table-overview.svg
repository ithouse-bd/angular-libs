  <text x="186" y="61" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#6d28d9">13 items</text>

  <rect x="736" y="42" width="176" height="34" rx="10" fill="#ffffff" stroke="#dfe3ec" />
