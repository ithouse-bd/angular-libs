      <rect x="45" y="265" width="15" height="15" rx="4" fill="#ffffff" stroke="#d1d5db" />
      <text x="86" y="277">4</text>
      <text x="118" y="277">260032</text>
      <text x="228" y="277">12</text>
      <text x="300" y="277">ANABIA AFRIN RODELA</text>
      <text x="470" y="277">Female</text>
      <text x="566" y="277">Islam</text>
      <text x="660" y="277">01733052331</text>
      <line x1="24" y1="292" x2="936" y2="292" stroke="#e8eaf0" />
